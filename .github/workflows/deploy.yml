name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo_name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/backend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.OWNER_LC }}/policy-analytics-backend:latest
            ghcr.io/${{ steps.repo_name.outputs.OWNER_LC }}/policy-analytics-backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.OWNER_LC }}/policy-analytics-frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.OWNER_LC }}/policy-analytics-frontend:${{ github.sha }}

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying images to staging environment..."
          echo "Backend tag: ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/backend:latest"
          echo "Frontend tag: ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/frontend:latest"
          echo "Deploy images to staging environment successfully triggered."
