name: Test & Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Check
        run: ruff check backend/

      - name: Ruff Format Check
        run: ruff format --check backend/

  backend-test:
    name: Backend Unit Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      MOCK_LLM: "true"
      USE_MOCK_DATA_SOURCES: "true"
      SECRET_KEY: "test-secret-key-for-ci-minimum-32-chars-long"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run Pytest with Coverage
        run: |
          pytest backend/tests/unit \
            --cov=backend/app \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  frontend-test:
    name: Frontend Lint & Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Unit Tests & Coverage
        run: npm test -- --coverage --passWithNoTests

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 14
