services:
  postgres:
    image: postgres:15-alpine
    container_name: policy_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy_pass}
      POSTGRES_DB: ${POSTGRES_DB:-policy_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-policy_user} -d ${POSTGRES_DB:-policy_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: policy_analytics_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policy_analytics_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-policy_user}:${POSTGRES_PASSWORD:-policy_pass}@postgres:5432/${POSTGRES_DB:-policy_analytics}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-min-32-chars-long-12345}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MOCK_LLM=${MOCK_LLM:-false}
      - PRIMARY_LLM_PROVIDER=${PRIMARY_LLM_PROVIDER:-gemini}
      - FALLBACK_LLM_PROVIDER=${FALLBACK_LLM_PROVIDER:-bedrock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - BEDROCK_API_KEY=${BEDROCK_API_KEY:-}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-2}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      - USE_MOCK_DATA_SOURCES=${USE_MOCK_DATA_SOURCES:-false}
      - USE_MOCK_DATA_AS_FALLBACK=${USE_MOCK_DATA_AS_FALLBACK:-false}
      - SINGSTAT_MCP_ENABLED=${SINGSTAT_MCP_ENABLED:-true}
      - SINGSTAT_MCP_URL=${SINGSTAT_MCP_URL:-https://www.singstat.gov.sg/data-tools-services/singstat-mcp}
      - SINGSTAT_API_KEY=${SINGSTAT_API_KEY:-}
      - DATAGOV_API_TOKEN=${DATAGOV_API_TOKEN:-}
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policy_analytics_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: policy_analytics_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
